name: Skill Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Skill list is discovered from skills/*/ so adding a variant needs no CI edit.
      - name: Validate every SKILL.md (exists, non-empty, frontmatter)
        run: |
          fail=0
          shopt -s nullglob
          dirs=(skills/*/)
          if [ ${#dirs[@]} -eq 0 ]; then echo "FAIL: no skills found under skills/"; exit 1; fi
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            f="${dir}SKILL.md"
            if [ ! -s "$f" ]; then echo "FAIL: $f missing or empty"; fail=1; continue; fi
            for field in name description version author; do
              if ! grep -q "^${field}:" "$f"; then
                echo "FAIL: $f missing frontmatter field: $field"; fail=1
              fi
            done
            echo "PASS: $name"
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Verify references, scripts, commands, and core templates exist
        run: |
          fail=0
          required=(
            skills/openui-forge/references/openui-lang-spec.md
            skills/openui-forge/references/component-patterns.md
            skills/openui-forge/references/adapter-matrix.md
            skills/openui-forge/references/backend-patterns.md
            skills/openui-forge/scripts/detect-stack.sh
            skills/openui-forge/scripts/detect-stack.ps1
            skills/openui-forge/scripts/validate.sh
            skills/openui-forge/scripts/validate.ps1
            skills/openui-forge/templates/component.tsx.template
            skills/openui-forge/templates/library.ts.template
            skills/openui-forge/templates/page-fullscreen.tsx.template
            commands/openui.md
            commands/openui-scaffold.md
            commands/openui-component.md
            commands/openui-integrate.md
            commands/openui-prompt.md
            commands/openui-validate.md
            AGENTS.md
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then echo "FAIL: $f not found"; fail=1; else echo "PASS: $f"; fi
          done
          echo "Backend handler templates present: $(ls skills/openui-forge/templates/handler-* | wc -l)"
          [ "$fail" -eq 0 ] || exit 1

      - name: Run detection and validation tests
        run: bash scripts/test-detection.sh

      - name: Install every skill variant (registers on skills.sh)
        # Public GitHub URL so each install is attributed to the repo on skills.sh.
        # skills.sh is a telemetry index: a per-skill page appears after the first
        # `npx skills add <url> --skill <name>`. Discovering the list from skills/*/
        # makes the published-variants set self-healing. The CLI is pinned and runs
        # with --ignore-scripts so a hijacked release cannot execute postinstall code.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          for dir in skills/*/; do
            name=$(basename "$dir")
            echo "--- Installing $name ---"
            npx --yes skills@^1.5 add https://github.com/OthmanAdi/openui-forge --skill "$name" -g -y
          done
